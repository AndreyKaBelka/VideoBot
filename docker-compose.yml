services:
  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      river-migrate:
        condition: service_completed_successfully
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-videobot}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-videobot}
      DB_NAME: ${POSTGRES_DB:-videobot}
    restart: unless-stopped

  migrate:
    build:
      context: .
      dockerfile: Dockerfile.migrate
    depends_on:
      db:
        condition: service_healthy
    environment:
      GOOSE_DRIVER: postgres
      GOOSE_DBSTRING: postgres://${POSTGRES_USER:-videobot}:${POSTGRES_PASSWORD:-videobot}@db:5432/${POSTGRES_DB:-videobot}?sslmode=disable
    volumes:
      - ./migrations:/migrations
    command: ["-dir", "/migrations", "up"]
    restart: "no"

  river-migrate:
    build:
      context: .
      dockerfile: Dockerfile.river-migrate
    depends_on:
      db:
        condition: service_healthy
    command:
      - migrate-up
      - --database-url
      - postgres://${POSTGRES_USER:-videobot}:${POSTGRES_PASSWORD:-videobot}@db:5432/${POSTGRES_DB:-videobot}?sslmode=disable
    restart: "no"

  workers:
    build:
      context: .
      dockerfile: Dockerfile.workers
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      river-migrate:
        condition: service_completed_successfully
      selenium:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-videobot}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-videobot}
      DB_NAME: ${POSTGRES_DB:-videobot}
      SELENIUM_URL: http://selenium:4444/wd/hub
    restart: unless-stopped

  selenium:
    image: selenium/standalone-firefox:4.27.0
    shm_size: 2gb
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4444/wd/hub/status"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-videobot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-videobot}
      POSTGRES_DB: ${POSTGRES_DB:-videobot}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-videobot}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
